name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: mthse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci_pw
      PGDATABASE: mthse
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Unit tests (no database needed)
        run: npm test

      - name: Apply migration 0001
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/0001_identity.sql

      - name: RLS isolation test (SQL)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rls_isolation.sql

      - name: Apply migration 0002 (issues and actions)
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/0002_issues_actions.sql

      - name: Workflow constraints test (SQL)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/workflow_constraints.sql

      - name: Apply migration 0003 (templates)
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/0003_templates.sql

      - name: Template constraints test (SQL)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/templates_constraints.sql

      - name: Apply migration 0004 (inspections)
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/0004_inspections.sql

      - name: Inspection constraints test (SQL)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/inspections_constraints.sql

      - name: Apply migration 0005 (invitations)
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/0005_invitations.sql

      - name: Invitation constraints test (SQL)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/invitations_constraints.sql

      - name: Apply migration 0006 (media)
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/0006_media.sql

      - name: Media constraints test (SQL)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/media_constraints.sql

      - name: Apply migration 0007 (notifications)
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/0007_notifications.sql

      - name: Notification constraints test (SQL)
        run: psql -v ON_ERROR_STOP=1 -f db/tests/notifications_constraints.sql

      - name: Bootstrap two organizations (tests the onboarding script on real PostgreSQL)
        run: |
          node scripts/bootstrap-org.ts --org "Org A" --email a@example.com --name "Admin A" --uid CI_ORG_A_ADMIN_UID_0000001 | psql -v ON_ERROR_STOP=1
          node scripts/bootstrap-org.ts --org "Org B" --email b@example.com --name "Admin B" --uid CI_ORG_B_ADMIN_UID_0000002 | psql -v ON_ERROR_STOP=1
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS orgs FROM organizations" -c "SELECT count(*) AS roles FROM roles"

      - name: Create app_user login
        run: psql -v ON_ERROR_STOP=1 -c "ALTER ROLE app_user LOGIN PASSWORD 'ci_app_pw'"

      - name: Install API dependencies
        run: npm install --prefix apps/api

      - name: Integration tests (API + real PostgreSQL as app_user)
        env:
          DATABASE_URL: postgres://app_user:ci_app_pw@127.0.0.1:5432/mthse
          CHROMIUM_PATH: /usr/bin/google-chrome
          PDF_NO_SANDBOX: '1'
        run: npm run test:integration

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --prefix apps/web
      - name: Type check
        run: npm run typecheck --prefix apps/web
      - name: Build the PWA
        run: npm run build --prefix apps/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

  images:
    # Proves that the production Docker images build and that the compose file is valid (nothing is pushed).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate the production compose file
        run: |
          printf 'DOMAIN=example.org\nPOSTGRES_PASSWORD=x\nAPP_DB_PASSWORD=y\nFIREBASE_PROJECT_ID=z\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f docker-compose.prod.yml config --quiet
      - name: Build the API image (Node + Chromium + Arabic fonts)
        run: docker build -f Dockerfile.api -t mthse-api:ci .
      - name: The API image contains Chromium and Arabic-capable fonts
        run: |
          docker run --rm --entrypoint sh mthse-api:ci -c '/usr/bin/chromium --version && fc-list :lang=ar | head -3 | grep -q . && echo "arabic fonts: ok"'
      - name: Build the web image (PWA + Caddy)
        run: docker build -f Dockerfile.web -t mthse-web:ci .
      - name: Validate the Caddy configuration
        run: |
          docker run --rm -e DOMAIN=example.org --entrypoint caddy mthse-web:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
